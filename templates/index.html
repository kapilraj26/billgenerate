
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{{ title | default('ஸ்ரீ கருப்பையா துணை', true) }}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>
        {{ title | default('ஸ்ரீ கருப்பையா துணை', true) }}
    </h1>

    <h2 style="text-align:center;">
        Vegetable Credit Sales Billing System
    </h2>

    <form method="POST">

        <div class="row">
            <div class="input-box">
                <label>Language</label>
                <select id="language" onchange="changeLanguage()">
                    <option value="en">English</option>
                    <option value="ta">தமிழ்</option>
                </select>
            </div>
        </div>

        <div class="row">

            <div class="input-box">
                <label id="lbl_phone">Phone Number</label>
                <input type="text" id="phone" name="phone" required>
            </div>

            <div class="input-box">
                <label id="lbl_customer">Customer Name</label>
                <input type="text" id="customer" name="customer" required>
            </div>

        </div>

        <div class="row">

            <div class="input-box">
                <label id="lbl_pending">Previous Balance</label>
                <input type="number" id="pending" name="pending"
                       value="0" readonly>
            </div>

            <div class="input-box">
                <label id="lbl_received">Cash Received</label>
                <input type="number" name="received" value="0">
            </div>

        </div>

        <h2 id="lbl_product">Product Details</h2>

        <table id="items">

            <tr>
                <th id="th_product">Product</th>
                <th id="th_qty">Quantity</th>
                <th id="th_rate">Rate</th>
                <th id="th_remove">Remove</th>
            </tr>

            <tr>
                <td>
                    <input type="text" name="product[]" required>
                </td>

                <td>
                    <input type="number" step="0.01"
                           name="qty[]" required>
                </td>

                <td>
                    <input type="number" step="0.01"
                           name="rate[]" required>
                </td>

                <td>
                    <button type="button"
                            onclick="removeRow(this)">X</button>
                </td>
            </tr>

        </table>

        <br>

        <button type="button" onclick="addRow()">
            Add Product
        </button>

        <button type="submit">
            Generate Bill
        </button>

    </form>

</div>

<script>

function addRow() {

    let table = document.getElementById("items");
    let row = table.insertRow();

    row.innerHTML = `
        <td><input type="text" name="product[]" required></td>
        <td><input type="number" step="0.01" name="qty[]" required></td>
        <td><input type="number" step="0.01" name="rate[]" required></td>
        <td><button type="button" onclick="removeRow(this)">X</button></td>
    `;
}

function removeRow(button) {

    let row = button.parentNode.parentNode;
    let table = document.getElementById("items");

    if (table.rows.length > 2) {
        row.remove();
    }
}

/* Customer Search */

document.getElementById("phone")
.addEventListener("blur", function () {

    let phone = this.value;

    fetch("/customer/" + phone)
    .then(response => response.json())
    .then(data => {

        if (data.name !== "") {

            document.getElementById("customer").value = data.name;
            document.getElementById("pending").value = data.balance;
        }
    });

});

/* Language */

function changeLanguage() {

    let lang = document.getElementById("language").value;

    const labels = {

        en: {
            lbl_phone: "Phone Number",
            lbl_customer: "Customer Name",
            lbl_pending: "Previous Balance",
            lbl_received: "Cash Received",
            lbl_product: "Product Details",
            th_product: "Product",
            th_qty: "Quantity",
            th_rate: "Rate",
            th_remove: "Remove"
        },

        ta: {
            lbl_phone: "தொலைபேசி எண்",
            lbl_customer: "வாடிக்கையாளர் பெயர்",
            lbl_pending: "முந்தைய நிலுவை",
            lbl_received: "பெறப்பட்ட தொகை",
            lbl_product: "பொருள் விவரங்கள்",
            th_product: "பொருள்",
            th_qty: "அளவு",
            th_rate: "விலை",
            th_remove: "நீக்கு"
        }

    };

    Object.keys(labels[lang]).forEach(id => {
        document.getElementById(id).innerHTML =
            labels[lang][id];
    });

}

</script>

</body>
</html>
